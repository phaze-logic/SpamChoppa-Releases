name: Bug report
description: Report a reproducible SpamChoppa problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Read troubleshooting first. Use synthetic numbers. Do not post backups, personal call history, unredacted phone screenshots, credentials, or vulnerability details. Report vulnerabilities privately using SECURITY.md."
  - type: input
    id: version
    attributes:
      label: SpamChoppa version and build
      description: Find these in Settings → About SpamChoppa.
      placeholder: "0.2.10 (12)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android version and device model
      placeholder: "Android version; manufacturer and model (no serial number)"
    validations:
      required: true
  - type: dropdown
    id: context
    attributes:
      label: Where did the problem occur?
      options:
        - App UI or settings
        - Test a number
        - Real incoming call
        - Install or update
        - Backup or restore
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include default-screening role, Contacts permission, schedule, and synthetic rule examples when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error text with personal information removed.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal data and am not posting a backup or security vulnerability.
          required: true
